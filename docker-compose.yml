services:

  # ── Fingerprint server ────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fingerprint-server
    restart: unless-stopped
    # Not exposed to the host — only reachable inside the compose network
    expose:
      - "8080"
    environment:
      RULES_PATH: /app/rules/fingerprints.yaml
    # Root FS is read-only; only /tmp is writable (for Go's net internals)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Real health check: the server binary itself calls GET /health and
    # exits 0/1, so no shell or curl is required in the scratch image.
    healthcheck:
      test: ["CMD", "/server", "-health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ── Fingerprint client ────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fingerprint-client
    # Client only starts after the server passes its health check
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL: http://server:8080
    # Mount the data directory read-only; input.json lives there
    volumes:
      - ./data:/data:ro
    command: ["/client", "/data/input.json", "http://server:8080"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    # Client exits after printing results; restart only on failure
    restart: "no"

networks:
  # Isolated bridge: containers communicate with each other but cannot
  # reach the public internet at runtime.
  internal:
    driver: bridge
    internal: true
